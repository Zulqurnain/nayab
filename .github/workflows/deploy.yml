# Layer 7: CI/CD — Deploy to VPS on push to main
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/nayab
            GIT_SSH_COMMAND="ssh -i /root/.ssh/github_vps -o StrictHostKeyChecking=no" git pull origin main
            npm ci --omit=dev
            pm2 stop offllama-server || true
            NODE_OPTIONS="--max-old-space-size=512" npm run build
            cp -r public/. .next/standalone/public/ 2>/dev/null || true
            cp -r .next/static/. .next/standalone/.next/static/ 2>/dev/null || true
            pm2 reload nayab --update-env || pm2 restart nayab
            pm2 start offllama-server || true
            pm2 save
            echo "Deploy complete"
